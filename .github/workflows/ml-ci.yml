name: Student Result ML CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-test-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train model
        run: python train_model.py

      - name: Enforce ML quality gate
        env:
          MINIMUM_ACCURACY: "0.85"
        run: python quality_gate.py

      - name: Run automated ML and API tests
        run: python -m unittest discover -s tests -v

      - name: Upload validated ML artifacts
        uses: actions/upload-artifact@v4
        with:
          name: student-result-ml-artifacts
          path: |
            student_result_model.pkl
            metrics.json
            student_results.csv
          if-no-files-found: error
          retention-days: 7

      - name: Prepare release candidate
        run: |
          mkdir -p release_candidate
          cp app.py requirements.txt Dockerfile .dockerignore release_candidate/
          cp student_result_model.pkl metrics.json release_candidate/
          printf '%s\n' \
            'Student Result Prediction API' \
            'Build: generated by GitHub Actions after passing tests and quality gate.' \
            'Run locally: docker build -t student-result-ml . && docker run --rm -p 5000:5000 student-result-ml' \
            'Health: GET /health' \
            'Prediction: POST /predict' \
            > release_candidate/DEPLOYMENT.txt

      - name: Upload Docker-ready release candidate
        uses: actions/upload-artifact@v4
        with:
          name: student-result-ml-release
          path: release_candidate/
          if-no-files-found: error
          retention-days: 7

  docker-validation:
    needs: train-test-package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies and create model
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python train_model.py
          python quality_gate.py

      - name: Run tests before container build
        run: python -m unittest discover -s tests -v

      - name: Build Docker image
        run: docker build -t student-result-ml:${{ github.sha }} .

      - name: Start Docker container
        run: |
          docker run -d --name student-result-ml-container \
            -p 5000:5000 student-result-ml:${{ github.sha }}

      - name: Wait for health endpoint
        run: |
          for i in {1..20}; do
            if curl --fail --silent http://localhost:5000/health; then
              echo "Application is ready."
              exit 0
            fi
            echo "Waiting for application... attempt $i"
            sleep 2
          done
          docker logs student-result-ml-container
          exit 1

      - name: Test prediction endpoint
        run: |
          response=$(curl --fail --silent --show-error \
            -X POST http://localhost:5000/predict \
            -H "Content-Type: application/json" \
            -d '{"attendance":95,"internal_marks":90,"assignment_marks":90,"previous_score":90}')
          echo "Prediction response: $response"
          echo "$response" | grep -q '"prediction":"PASS"'

      - name: Show container logs
        if: always()
        run: docker logs student-result-ml-container || true

      - name: Stop and remove container
        if: always()
        run: docker rm -f student-result-ml-container || true
